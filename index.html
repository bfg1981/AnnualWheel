<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Annual wheel</title>
    <link rel="stylesheet" href="styles.css?v=23" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Annual wheel, home" data-i18n-aria-label="Annual wheel, home"><span class="brand-mark"><i></i><i></i><i></i></span> Annual wheel</a>
        <div class="year-control" aria-label="Selected year" data-i18n-aria-label="Selected year"><button id="previous-year" aria-label="Previous year" data-i18n-aria-label="Previous year">‹</button><strong id="selected-year"></strong><button id="next-year" aria-label="Next year" data-i18n-aria-label="Next year">›</button></div>
        <button class="profile" aria-label="Open account" data-i18n-aria-label="Open account">••</button>
      </header>
      <section class="intro">
        <div><p class="eyebrow"><span data-i18n="Annual plan">Annual plan</span> · <span class="year-text"></span></p><h1>Annual wheel</h1><p class="lede"></p></div>
        <div class="legend" aria-label="Filter layers" data-i18n-aria-label="Filter layers"></div>
      </section>
      <section class="wheel-layout">
        <aside class="schedule-panel">
          <div class="panel-heading"><p class="eyebrow">Key dates</p></div>
          <button class="all-deadlines"><span data-i18n="View all deadlines">View all deadlines</span> <span>→</span></button>
        </aside>
        <div class="wheel-column">
          <div class="wheel-toolbar"><p><span class="live-dot"></span><span data-i18n="Today">Today</span></p><div class="wheel-actions"><div class="render-mode" aria-label="Rendering mode" data-i18n-aria-label="Rendering mode"><button type="button" data-render-mode="year" data-i18n="Year by year">Year by year</button><button type="button" data-render-mode="continuous" data-i18n="Continuous">Continuous</button></div><button class="today-button" id="today-button" data-i18n="Today">Today</button><div class="zoom-control" aria-label="Zoom annual wheel" data-i18n-aria-label="Zoom annual wheel"><button id="zoom-out" aria-label="Zoom out" data-i18n-aria-label="Zoom out">−</button><span id="zoom-level"></span><button id="zoom-in" aria-label="Zoom in" data-i18n-aria-label="Zoom in">+</button></div></div></div>
          <div class="wheel-stage"><div class="year-wheel" aria-label="Annual wheel" data-i18n-aria-label="Annual wheel"><svg class="year-band" viewBox="0 0 100 100" aria-hidden="true"><defs><pattern id="year-cycle-0" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#eaf3fa"/><path d="M0 0h2v2H0zM2 2h2v2H2z" fill="#5d91b7" fill-opacity=".65"/></pattern><pattern id="year-cycle-1" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#f6eef5"/><path d="M0 0h3.5v3.5H0zM3.5 3.5H7V7H3.5z" fill="#9a638f" fill-opacity=".72"/></pattern><pattern id="year-cycle-2" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#ebf6f2"/><path d="M0 0h2.5v2.5H0zM2.5 2.5H5V5H2.5z" fill="#4f9b89" fill-opacity=".62"/></pattern><pattern id="year-cycle-3" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#faf3e9"/><path d="M0 0h4v4H0zM4 4h4v4H4z" fill="#bd8a50" fill-opacity=".68"/></pattern></defs><g class="year-segment" data-year-segment="0"><circle cx="50" cy="50" r="46" pathLength="100"/><text text-anchor="middle"></text></g><g class="year-segment" data-year-segment="1"><circle cx="50" cy="50" r="46" pathLength="100"/><text text-anchor="middle"></text></g></svg><div class="ring ring-outer"></div><div class="ring ring-middle"></div><div class="ring ring-inner"></div><div class="today-line"><span></span></div><div class="center-disc"><span data-i18n="Recurring rhythm">RECURRING RHYTHM</span><em data-i18n="a new cycle every year">a new cycle every year</em></div><div class="month jan"><b>JAN</b></div><div class="month feb"><b>FEB</b></div><div class="month mar"><b>MAR</b></div><div class="month apr"><b>APR</b></div><div class="month may"><b>MAY</b></div><div class="month jun"><b>JUN</b></div><div class="month jul"><b>JUL</b></div><div class="month aug"><b>AUG</b></div><div class="month sep"><b>SEP</b></div><div class="month oct"><b>OCT</b></div><div class="month nov"><b>NOV</b></div><div class="month dec"><b>DEC</b></div></div><svg class="year-band-cut" viewBox="0 0 100 100" aria-hidden="true"><defs><pattern id="cut-cycle-0" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#eaf3fa"/><path d="M0 0h2v2H0zM2 2h2v2H2z" fill="#5d91b7" fill-opacity=".65"/></pattern><pattern id="cut-cycle-1" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#f6eef5"/><path d="M0 0h3.5v3.5H0zM3.5 3.5H7V7H3.5z" fill="#9a638f" fill-opacity=".72"/></pattern><pattern id="cut-cycle-2" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#ebf6f2"/><path d="M0 0h2.5v2.5H0zM2.5 2.5H5V5H2.5z" fill="#4f9b89" fill-opacity=".62"/></pattern><pattern id="cut-cycle-3" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#faf3e9"/><path d="M0 0h4v4H0zM4 4h4v4H4z" fill="#bd8a50" fill-opacity=".68"/></pattern></defs><circle data-year-cut="incoming" cx="50" cy="50" r="46" pathLength="100"/><circle data-year-cut="outgoing" cx="50" cy="50" r="46" pathLength="100"/></svg><div class="helix-cut" aria-hidden="true"></div></div>
          <p class="wheel-hint" data-i18n="Drag the wheel to browse the year · select a marker to see the deadline">Drag the wheel to browse the year · select a marker to see the deadline</p>
        </div>
      </section>
    </main>
    <script src="/annual-wheel-config.js"></script>
    <script src="lib/schedule.browser.js"></script>
    <script src="lib/i18n.browser.js"></script>
    <script src="script.js?v=18"></script>
  </body>
</html>
