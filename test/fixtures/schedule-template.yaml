anchors:
  planning_day:
    defaultDate: { month: 3, day: 31 }
  summer_break:
    defaultDate: { month: 6, day: 20 }
constraints:
  board_meeting: { weekday: 3 }
items:
  - id: planning-day
    status: derived
    schedule: { kind: anchor, anchor: planning_day }
  - id: annual-event
    status: set
    schedule: { kind: nth_weekday, month: 8, weekday: 6, occurrence: 2 }
  - id: follow-up
    status: derived
    schedule: { kind: next_weekday, anchor: annual-event, weekday: 1 }
  - id: before-break
    status: derived
    schedule: { kind: previous_weekday, anchor: summer_break, weekday: 1 }
  - id: week-before-planning
    status: derived
    schedule: { kind: offset, anchor: planning_day, days: -7 }
  - id: february-end
    status: set
    schedule: { kind: month_end, month: 2 }
  - id: board-meeting-january
    status: set
    schedule: { kind: nth_full_weekday, month: 1, constraints: [board_meeting], occurrence: 2 }
  - id: board-meeting-before-planning
    status: derived
    schedule: { kind: previous_weekday, before: { anchor: planning_day, offsetDays: -7 }, constraints: [board_meeting], inclusive: true }
  - id: board-meeting-after-planning
    status: derived
    schedule:
      kind: next_weekday
      after:
        - planning_day
        - { anchor: board-meeting-before-planning, offsetDays: 31 }
      constraints: [board_meeting]
  - id: board-meeting-autumn
    status: set
    schedule: { kind: nth_weekday, month: 8, constraints: [board_meeting], occurrence: 2 }
  - id: board-meeting-november
    status: set
    schedule: { kind: last_weekday, month: 11, constraints: [board_meeting] }
