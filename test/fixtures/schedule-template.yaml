anchors:
  open_night:
    defaultDate: { month: 10, day: 16 }
  dome_service:
    defaultDate: { month: 5, day: 22 }
constraints:
  lab_day: { weekday: 2 }
items:
  - id: open-night
    status: derived
    schedule: { kind: anchor, anchor: open_night }
  - id: sky-survey
    status: set
    schedule: { kind: nth_weekday, month: 5, constraints: [lab_day], occurrence: 3 }
  - id: process-images
    status: derived
    schedule: { kind: next_weekday, anchor: sky-survey, weekday: 5 }
  - id: inspect-dome
    status: derived
    schedule: { kind: previous_weekday, anchor: dome_service, weekday: 1 }
  - id: print-charts
    status: derived
    schedule: { kind: offset, anchor: open_night, days: -4 }
  - id: february-end
    status: set
    schedule: { kind: month_end, month: 2 }
  - id: align-mirrors
    status: set
    schedule: { kind: nth_full_weekday, month: 6, constraints: [lab_day], occurrence: 3 }
  - id: prepare-lenses
    status: derived
    schedule: { kind: previous_weekday, before: { anchor: open_night, offsetDays: -3 }, constraints: [lab_day], inclusive: true }
  - id: store-lenses
    status: derived
    schedule:
      kind: next_weekday
      after:
        - open_night
        - { anchor: prepare-lenses, offsetDays: 12 }
      constraints: [lab_day]
  - id: clean-filters
    status: set
    schedule: { kind: last_weekday, month: 7, constraints: [lab_day] }
